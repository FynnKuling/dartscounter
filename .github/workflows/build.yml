name: Build APK

# Dit ene bestand maakt het hele Android-project aan en bouwt de APK.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Maak het project aan
        run: |
          mkdir -p .
          cat > settings.gradle <<'EOF_DARTCOUNTER'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Dartcounter'
          include ':app'
          EOF_DARTCOUNTER
          mkdir -p .
          cat > build.gradle <<'EOF_DARTCOUNTER'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_DARTCOUNTER
          mkdir -p .
          cat > gradle.properties <<'EOF_DARTCOUNTER'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_DARTCOUNTER
          mkdir -p app
          cat > app/build.gradle <<'EOF_DARTCOUNTER'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'nl.dartcounter'
              compileSdk 34

              defaultConfig {
                  applicationId 'nl.dartcounter'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_DARTCOUNTER
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_DARTCOUNTER'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:label="Dartcounter"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation|uiMode"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF_DARTCOUNTER
          mkdir -p app/src/main/java/nl/dartcounter
          cat > app/src/main/java/nl/dartcounter/MainActivity.java <<'EOF_DARTCOUNTER'
          package nl.dartcounter;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);

                  web.setBackgroundColor(0xFF0F1420);
                  web.setWebViewClient(new WebViewClient());
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  web.requestFocus();

                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      web.setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF_DARTCOUNTER
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_DARTCOUNTER'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0F1420" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#2EE6A6" android:pathData="M54,54m-44,0a44,44 0,1 1,88 0a44,44 0,1 1,-88 0" />
              <path android:fillColor="#0F1420" android:pathData="M54,54m-34,0a34,34 0,1 1,68 0a34,34 0,1 1,-68 0" />
              <path android:fillColor="#2EE6A6" android:pathData="M54,54m-24,0a24,24 0,1 1,48 0a24,24 0,1 1,-48 0" />
              <path android:fillColor="#0F1420" android:pathData="M54,54m-14,0a14,14 0,1 1,28 0a14,14 0,1 1,-28 0" />
              <path android:fillColor="#FF5A6E" android:pathData="M54,54m-6,0a6,6 0,1 1,12 0a6,6 0,1 1,-12 0" />
          </vector>
          EOF_DARTCOUNTER
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/banner.xml <<'EOF_DARTCOUNTER'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path android:fillColor="#0F1420" android:pathData="M0,0h320v180h-320z" />
              <path android:fillColor="#2EE6A6" android:pathData="M160,90m-72,0a72,72 0,1 1,144 0a72,72 0,1 1,-144 0" />
              <path android:fillColor="#0F1420" android:pathData="M160,90m-56,0a56,56 0,1 1,112 0a56,56 0,1 1,-112 0" />
              <path android:fillColor="#2EE6A6" android:pathData="M160,90m-40,0a40,40 0,1 1,80 0a40,40 0,1 1,-80 0" />
              <path android:fillColor="#0F1420" android:pathData="M160,90m-24,0a24,24 0,1 1,48 0a24,24 0,1 1,-48 0" />
              <path android:fillColor="#FF5A6E" android:pathData="M160,90m-10,0a10,10 0,1 1,20 0a10,10 0,1 1,-20 0" />
          </vector>
          EOF_DARTCOUNTER
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/index.html <<'EOF_DARTCOUNTER'
          <!doctype html>
          <html lang="nl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <title>Dartcounter</title>
          <style>
          :root{--bg:#0f1420;--card:#1a2233;--card2:#222c42;--text:#eef2fa;--mute:#8b97b3;--acc:#2ee6a6;--warn:#ff5a6e;--gold:#ffc94d}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
          button{font:inherit;color:inherit;background:var(--card2);border:2px solid transparent;border-radius:12px;cursor:pointer}
          button:focus,input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(46,230,166,.45)}
          button:focus{transform:scale(1.04)}
          button:active{transform:scale(.97)}
          #app{display:grid;grid-template-columns:1fr min(38vw,440px);grid-template-rows:auto 1fr;gap:1.2vh 1.2vw;height:100%;padding:1.5vh 1.2vw}
          header{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;font-size:clamp(14px,2.6vh,24px);color:var(--mute)}
          header b{color:var(--text)}
          header .btns{display:flex;gap:8px}
          header button{padding:.5em 1em;font-size:inherit}
          #players{display:grid;gap:1.2vh 1vw;min-height:0}
          #players.p1{grid-template-columns:1fr}
          #players.p2{grid-template-columns:1fr 1fr}
          #players.p3,#players.p4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
          #players.p5,#players.p6{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
          #players.p7,#players.p8{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr}
          .p5 .sc,.p6 .sc,.p7 .sc,.p8 .sc{font-size:clamp(40px,min(14vh,6.5vw),120px)}
          .p5 .st span:nth-child(n+3),.p6 .st span:nth-child(n+3),.p7 .st span:nth-child(n+3),.p8 .st span:nth-child(n+3){display:none}
          .pl{background:var(--card);border-radius:18px;padding:1.5vh 1.2vw;display:flex;flex-direction:column;justify-content:space-between;border:3px solid transparent;min-height:0;overflow:hidden}
          .pl.on{border-color:var(--acc);background:var(--card2)}
          .pl .top{display:flex;justify-content:space-between;align-items:center;font-size:clamp(16px,3.4vh,34px);font-weight:600}
          .pl .legs{color:var(--gold)}
          .pl .sc{font-size:clamp(60px,min(24vh,13vw),240px);font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
          .p3 .sc,.p4 .sc{font-size:clamp(50px,min(15vh,9vw),160px)}
          .pl .hint{text-align:center;color:var(--acc);font-size:clamp(14px,3vh,30px);min-height:1.3em;font-weight:600}
          .pl .st{display:flex;justify-content:space-around;color:var(--mute);font-size:clamp(12px,2.3vh,22px)}
          .pl .st b{color:var(--text)}
          #pad{display:flex;flex-direction:column;gap:1vh;min-height:0}
          #disp{background:var(--card);border-radius:14px;padding:1vh 1vw;text-align:center;font-size:clamp(14px,2.4vh,22px);color:var(--mute)}
          #disp b{display:block;font-size:clamp(30px,7vh,70px);color:var(--text);min-height:1.1em;font-variant-numeric:tabular-nums}
          #disp.bad b{color:var(--warn)}
          #keys{display:grid;grid-template-columns:repeat(3,1fr);gap:1vh .8vw;flex:1;min-height:0}
          #keys button{font-size:clamp(20px,5vh,46px);font-weight:700}
          #keys .ok{background:var(--acc);color:#04261b;grid-column:span 1}
          #keys .del{background:#3a2430}
          #quick{display:grid;grid-template-columns:repeat(5,1fr);gap:.8vh .5vw}
          #quick button{padding:.8vh 0;font-size:clamp(12px,2.4vh,22px)}
          #quick .bust{background:#3a2430}
          .overlay{position:fixed;inset:0;background:rgba(8,11,18,.94);display:none;align-items:center;justify-content:center;z-index:10;padding:2vh 3vw}
          .overlay.show{display:flex}
          .box{background:var(--card);border-radius:20px;padding:3vh 3vw;width:min(900px,96vw);max-height:96vh;overflow:auto}
          .box h1,.box h2{margin:0 0 1.5vh;font-size:clamp(22px,5vh,44px)}
          .row{display:flex;flex-wrap:wrap;gap:1vh 1vw;align-items:center;margin:1.4vh 0;font-size:clamp(14px,2.8vh,26px)}
          .row>span{min-width:6.5em;color:var(--mute)}
          .opt{padding:.6em 1.1em}
          .opt.sel{background:var(--acc);color:#04261b;font-weight:700}
          .names{display:grid;grid-template-columns:1fr 1fr;gap:1vh 1vw}
          input[type=text]{width:100%;padding:.6em .8em;font-size:clamp(14px,2.8vh,26px);background:var(--bg);color:var(--text);border:2px solid #33405c;border-radius:10px}
          .go{width:100%;margin-top:2vh;padding:.7em;background:var(--acc);color:#04261b;font-size:clamp(18px,4vh,36px);font-weight:800}
          #rot{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;z-index:20;font-size:22px;padding:30px}
          @media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
          </style>
          </head>
          <body>
          <div id="rot">Draai je scherm naar liggend 📱↔️</div>
          <div id="app">
            <header>
              <div id="info"></div>
              <div class="btns"><button id="addp">＋ Speler</button><button id="undo">↶ Terug</button><button id="menu">☰ Nieuw spel</button></div>
            </header>
            <div id="players"></div>
            <div id="pad">
              <div id="disp"><span id="who"></span><b id="val">&nbsp;</b></div>
              <div id="quick"></div>
              <div id="keys"></div>
            </div>
          </div>

          <div class="overlay show" id="setup">
            <div class="box">
              <h1>🎯 Nieuw spel</h1>
              <div class="row"><span>Startscore</span><div id="o-score"></div></div>
              <div class="row"><span>Legs om te winnen</span><div id="o-legs"></div></div>
              <div class="row"><span>Finish</span><div id="o-dbl"></div></div>
              <div class="row"><span>Spelers</span><button class="opt" id="addsetup">＋ Speler toevoegen</button></div>
              <div class="names" id="names"></div>
              <button class="go" id="start">Start</button>
            </div>
          </div>

          <div class="overlay" id="addov">
            <div class="box">
              <h2>Speler toevoegen</h2>
              <input type="text" id="addname" maxlength="14" placeholder="Naam">
              <button class="go" id="addok">Toevoegen</button>
              <button class="go" id="addcancel" style="background:var(--card2);color:var(--text)">Annuleren</button>
            </div>
          </div>

          <div class="overlay" id="win">
            <div class="box" style="text-align:center">
              <h1 id="wintxt"></h1>
              <p id="winsub" style="color:var(--mute);font-size:clamp(14px,3vh,26px)"></p>
              <button class="go" id="again">Opnieuw met dezelfde instellingen</button>
              <button class="go" id="newgame" style="background:var(--card2);color:var(--text)">Nieuw spel</button>
            </div>
          </div>

          <script>
          (function(){
          'use strict';
          var $=function(id){return document.getElementById(id)};
          var MAXP=8;
          var cfg={score:501,legs:1,dbl:true,names:['Speler 1','Speler 2']};
          var S=null,hist=[],buf='';

          /* ---------- checkout tabel ---------- */
          var all=[],fin=[];
          (function(){
            var i;
            for(i=20;i>=1;i--)all.push({l:'T'+i,v:3*i});
            all.push({l:'Bull',v:50});all.push({l:'25',v:25});
            for(i=20;i>=1;i--)all.push({l:String(i),v:i});
            for(i=20;i>=1;i--){var d={l:'D'+i,v:2*i};all.push(d);fin.push(d)}
            fin.unshift({l:'Bull',v:50});
          })();
          function hint(r){
            var a,b,c,i,j,k;
            if(r<2||r>170)return'';
            for(i=0;i<fin.length;i++)if(fin[i].v===r)return fin[i].l;
            for(i=0;i<all.length;i++)for(j=0;j<fin.length;j++)
              if(all[i].v+fin[j].v===r)return all[i].l+' → '+fin[j].l;
            for(i=0;i<all.length;i++)for(j=0;j<all.length;j++)for(k=0;k<fin.length;k++)
              if(all[i].v+all[j].v+fin[k].v===r)return all[i].l+' → '+all[j].l+' → '+fin[k].l;
            return'';
          }

          /* ---------- setup ---------- */
          function opts(id,list,key,fmt){
            var el=$(id);el.innerHTML='';
            list.forEach(function(v){
              var b=document.createElement('button');
              b.className='opt'+(cfg[key]===v?' sel':'');
              b.textContent=fmt?fmt(v):v;
              b.onclick=function(){cfg[key]=v;drawSetup()};
              el.appendChild(b);
            });
          }
          function drawSetup(){
            opts('o-score',[101,201,301,501,701],'score');
            opts('o-legs',[1,2,3,5,7],'legs');
            opts('o-dbl',[true,false],'dbl',function(v){return v?'Double-out':'Straight-out'});
            var n=$('names');n.innerHTML='';
            cfg.names.forEach(function(nm,i){
              var w=document.createElement('div');w.style.display='flex';w.style.gap='6px';
              var inp=document.createElement('input');inp.type='text';inp.value=nm;inp.maxLength=14;
              inp.oninput=function(){cfg.names[i]=inp.value};
              w.appendChild(inp);
              if(cfg.names.length>1){
                var x=document.createElement('button');x.textContent='✕';x.className='opt';
                x.onclick=function(){cfg.names.splice(i,1);drawSetup()};
                w.appendChild(x);
              }
              n.appendChild(w);
            });
            $('addsetup').style.display=cfg.names.length>=MAXP?'none':'';
          }

          /* ---------- spel ---------- */
          function newGame(){
            S={n:cfg.names.length,start:cfg.score,legsToWin:cfg.legs,dbl:cfg.dbl,cur:0,starter:0,over:false,p:[]};
            for(var i=0;i<cfg.names.length;i++)S.p.push({name:(cfg.names[i]||'Speler '+(i+1)).trim(),rem:cfg.score,legs:0,darts:0,sum:0,hi:0,n180:0,last:null,bust:false});
            hist=[];buf='';
            $('setup').classList.remove('show');$('win').classList.remove('show');
            render();
          }
          function openAdd(){
            if(!S||S.over||S.p.length>=MAXP)return;
            $('addname').value='Speler '+(S.p.length+1);
            $('addov').classList.add('show');$('addname').focus();$('addname').select();
          }
          function doAdd(){
            if(!S||S.p.length>=MAXP)return;
            snap();
            var nm=($('addname').value||'').trim()||'Speler '+(S.p.length+1);
            S.p.push({name:nm,rem:S.start,legs:0,darts:0,sum:0,hi:0,n180:0,last:null,bust:false});
            S.n=S.p.length;buf='';
            $('addov').classList.remove('show');render();
          }
          function snap(){hist.push(JSON.stringify(S));if(hist.length>200)hist.shift()}
          function submit(){
            if(!S||S.over)return;
            if(buf===''){flash();return}
            var sc=parseInt(buf,10);
            if(isNaN(sc)||sc<0||sc>180){flash();return}
            apply(sc);
          }
          function apply(sc){
            snap();
            var p=S.p[S.cur],r=p.rem-sc,bust=false;
            p.bust=false;
            if(r<0||(S.dbl&&r===1))bust=true;
            else if(r===0&&S.dbl&&!hint(p.rem))bust=true;
            p.darts+=3;
            if(bust){p.bust=true;p.last=0}
            else{
              p.rem=r;p.sum+=sc;p.last=sc;
              if(sc>p.hi)p.hi=sc;
              if(sc===180)p.n180++;
              if(r===0){legWon();return}
            }
            S.cur=(S.cur+1)%S.n;buf='';render();
          }
          function legWon(){
            var p=S.p[S.cur];p.legs++;buf='';
            if(p.legs>=S.legsToWin){S.over=true;render();showWin(p);return}
            S.starter=(S.starter+1)%S.n;S.cur=S.starter;
            S.p.forEach(function(x){x.rem=S.start;x.bust=false;x.last=null});
            render();
          }
          function showWin(p){
            $('wintxt').textContent='🏆 '+p.name+' wint!';
            var avg=p.darts?(p.sum/p.darts*3).toFixed(1):'0.0';
            $('winsub').textContent='Gemiddelde '+avg+' · hoogste beurt '+p.hi+' · 180s: '+p.n180;
            $('win').classList.add('show');$('again').focus();
          }
          function undo(){
            if(!hist.length)return;
            S=JSON.parse(hist.pop());buf='';$('win').classList.remove('show');render();
          }
          function flash(){var d=$('disp');d.classList.add('bad');setTimeout(function(){d.classList.remove('bad')},500)}

          /* ---------- weergave ---------- */
          function render(){
            var pl=$('players');pl.className='p'+S.n;pl.innerHTML='';
            S.p.forEach(function(p,i){
              var d=document.createElement('div');
              d.className='pl'+(i===S.cur&&!S.over?' on':'');
              var avg=p.darts?(p.sum/p.darts*3).toFixed(1):'–';
              var h=(i===S.cur&&!S.over)?hint(p.rem):'';
              d.innerHTML='<div class="top"><span>'+esc(p.name)+(i===S.starter?' •':'')+'</span><span class="legs">Legs '+p.legs+'</span></div>'+
                '<div class="sc">'+p.rem+'</div>'+
                '<div class="hint">'+(p.bust?'<span style="color:var(--warn)">BUST</span>':h)+'</div>'+
                '<div class="st"><span>Gem. <b>'+avg+'</b></span><span>Laatst <b>'+(p.last===null?'–':p.last)+'</b></span><span>Hoogst <b>'+p.hi+'</b></span><span>180s <b>'+p.n180+'</b></span></div>';
              pl.appendChild(d);
            });
            $('addp').style.display=S.p.length>=MAXP?'none':'';
            $('info').innerHTML='<b>'+S.start+'</b> · '+(S.dbl?'double-out':'straight-out')+' · first to <b>'+S.legsToWin+'</b>';
            $('who').textContent=S.over?'Spel afgelopen':'Beurt: '+S.p[S.cur].name+' · typ je score, Enter = klaar';
            $('val').innerHTML=buf===''?'&nbsp;':buf;
          }
          function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
          function press(k){
            if(!S||S.over)return;
            if(k==='del')buf=buf.slice(0,-1);
            else if(k==='ok'){submit();return}
            else if(buf.length<3){
              var nb=(buf+k).replace(/^0+(?=\d)/,'');
              if(parseInt(nb,10)<=180)buf=nb;else flash();
            }
            $('val').innerHTML=buf===''?'&nbsp;':buf;
          }

          /* ---------- invoer opbouwen ---------- */
          (function(){
            var k=$('keys'),keys=['1','2','3','4','5','6','7','8','9','del','0','ok'];
            keys.forEach(function(x){
              var b=document.createElement('button');
              b.textContent=x==='del'?'⌫':x==='ok'?'OK ✓':x;
              if(x==='ok')b.className='ok';if(x==='del')b.className='del';
              b.onclick=function(){press(x)};
              k.appendChild(b);
            });
            var q=$('quick');
            [26,41,45,60,81,85,100,121,140,180].forEach(function(v){
              var b=document.createElement('button');b.textContent=v;
              b.onclick=function(){if(S&&!S.over){buf=String(v);$('val').innerHTML=buf}};
              q.appendChild(b);
            });
            var z=document.createElement('button');z.textContent='Geen score (0)';z.className='bust';z.style.gridColumn='1/-1';
            z.onclick=function(){if(S&&!S.over){buf='0';$('val').innerHTML=buf}};q.appendChild(z);
          })();

          $('start').onclick=newGame;
          $('again').onclick=newGame;
          $('newgame').onclick=function(){$('win').classList.remove('show');$('setup').classList.add('show');drawSetup();$('start').focus()};
          $('menu').onclick=function(){$('setup').classList.add('show');drawSetup();$('start').focus()};
          $('undo').onclick=undo;
          $('addp').onclick=openAdd;
          $('addok').onclick=doAdd;
          $('addcancel').onclick=function(){$('addov').classList.remove('show')};
          $('addname').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();doAdd()}};
          $('addsetup').onclick=function(){
            if(cfg.names.length>=MAXP)return;
            cfg.names.push('Speler '+(cfg.names.length+1));drawSetup();
            var ins=$('names').querySelectorAll('input');ins[ins.length-1].focus();ins[ins.length-1].select();
          };

          /* ---------- toetsenbord, numpad en afstandsbediening ---------- */
          var navMode=false; /* true = laatst met pijltjes genavigeerd: Enter/OK drukt de gekozen knop */
          function shownOv(){return [].slice.call(document.querySelectorAll('.overlay.show'))}
          function blurActive(){var a=document.activeElement;if(a&&a.tagName==='BUTTON')a.blur()}
          function goBack(){
            var ov=shownOv();
            if(ov.length){
              var o=ov[ov.length-1];
              if(o.id==='addov')o.classList.remove('show');
              else if(o.id==='setup'&&S)o.classList.remove('show');
              return true;
            }
            if(buf!==''){buf='';$('val').innerHTML='&nbsp;';return true}
            return false;
          }
          function move(k){
            var ov=shownOv(),sc=ov.length?ov[ov.length-1]:$('app');
            var els=[].slice.call(sc.querySelectorAll('button,input')).filter(function(e){
              var r=e.getBoundingClientRect();return r.width>0&&r.height>0&&!e.disabled;
            });
            if(!els.length)return;
            var cur=document.activeElement;
            if(els.indexOf(cur)<0){
              var f=(sc===$('app'))?$('keys').children[4]:els[0];
              (f||els[0]).focus();return;
            }
            var cr=cur.getBoundingClientRect(),cx=cr.left+cr.width/2,cy=cr.top+cr.height/2,best=null,bd=1e9;
            els.forEach(function(e){
              if(e===cur)return;
              var r=e.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy,ok,p,s;
              if(k==='ArrowRight'){ok=dx>4;p=dx;s=Math.abs(dy)}
              else if(k==='ArrowLeft'){ok=dx<-4;p=-dx;s=Math.abs(dy)}
              else if(k==='ArrowDown'){ok=dy>4;p=dy;s=Math.abs(dx)}
              else{ok=dy<-4;p=-dy;s=Math.abs(dx)}
              if(!ok)return;
              var d=p+s*2.5;
              if(d<bd){bd=d;best=e}
            });
            if(best){best.focus();if(best.scrollIntoView)best.scrollIntoView({block:'nearest'})}
          }

          document.addEventListener('keydown',function(e){
            var k=e.key||'',t=e.target,inInput=t&&t.tagName==='INPUT';
            /* terug / Escape */
            if(k==='Escape'||k==='GoBack'||k==='BrowserBack'||e.keyCode===4){e.preventDefault();goBack();return}
            /* pijltjes = eigen navigatie (werkt ook op pc en op elke afstandsbediening) */
            if(k.indexOf('Arrow')===0){
              if(inInput&&(k==='ArrowLeft'||k==='ArrowRight'))return;
              e.preventDefault();navMode=true;move(k);return;
            }
            /* Enter in een naamveld: volgend veld, na het laatste naar Start */
            if(inInput&&k==='Enter'&&$('setup').classList.contains('show')){
              e.preventDefault();
              var ins=[].slice.call($('names').querySelectorAll('input')),i=ins.indexOf(t);
              if(i>=0&&i<ins.length-1)ins[i+1].focus();else $('start').focus();
              navMode=true;return;
            }
            if(shownOv().length||inInput)return; /* in schermen en velden werkt Enter/OK op de gekozen knop */
            /* cijfers: ook de numpad. Dit is wat je gegooid hebt */
            if(/^\d$/.test(k)){navMode=false;blurActive();press(k);e.preventDefault();return}
            if(k==='Backspace'){navMode=false;blurActive();press('del');e.preventDefault();return}
            if(k==='Enter'){
              /* met de afstandsbediening: OK drukt de gekozen knop */
              if(navMode&&t&&t.tagName==='BUTTON')return;
              blurActive();press('ok');e.preventDefault();return;
            }
            if(k==='z'&&(e.ctrlKey||e.metaKey)){undo();e.preventDefault()}
          });
          /* muis of touch: knop laten los, zodat Enter daarna de beurt afsluit */
          document.addEventListener('click',function(e){
            if(e.detail>0&&e.target&&e.target.tagName==='BUTTON'){navMode=false;e.target.blur()}
          },true);
          /* Terug-knop van de afstandsbediening: sluit eerst schermen, verlaat pas daarna de pagina */
          try{
            history.pushState({d:1},'');
            window.addEventListener('popstate',function(){
              if(goBack())history.pushState({d:1},'');else history.back();
            });
          }catch(err){}

          drawSetup();
          $('start').focus();
          })();
          </script>
          </body>
          </html>
          EOF_DARTCOUNTER

      - name: Controleer project
        run: |
          find . -type f -not -path './.git/*' -not -path './.gradle/*' | sort
          echo "--- app/build.gradle"
          cat app/build.gradle
          echo "--- projecten"
          gradle projects --no-daemon

      - name: Bouw de APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dartcounter-apk
          path: app/build/outputs/apk/debug/app-debug.apk
